name: release

# Publishes a tagged commit to npm with a provenance attestation.
#
# Auth is npm trusted publishing (OIDC): this workflow needs no NPM_TOKEN, but
# the package must list this repository and workflow as a trusted publisher.
# See RELEASING.md for the one-time setup.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          # No registry-url on purpose: it writes an .npmrc with a
          # ${NODE_AUTH_TOKEN} placeholder, and trusted publishing must run
          # without a token. The default registry is registry.npmjs.org.

      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "releasing ${version}"

      - name: npm supports trusted publishing
        run: |
          version="$(npm --version)"
          echo "npm ${version}"
          node -e 'const [major, minor] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && Number(process.argv[1].split(".")[2]) < 1)))) {
              console.error("npm >= 11.5.1 is required for trusted publishing");
              process.exit(1);
            }' "${version}"

      - name: Test
        run: npm test

      - name: Check for an already published version
        id: registry
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`);
          if (!response.ok && response.status !== 404) throw new Error(`Registry check failed: ${response.status}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `published=${response.ok}\n`);
          JS

      - name: Publish
        if: steps.registry.outputs.published != 'true'
        run: npm publish --provenance --access public

      - name: Verify published version
        run: npm view "dsh-composer-predictions@$(node -p "require('./package.json').version")" version
